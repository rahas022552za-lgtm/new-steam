<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คชื่อนักเรียน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 p-6">

    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-2xl font-bold">ระบบเช็คชื่อนักเรียน</h1>
            <div id="status" class="text-sm font-semibold text-yellow-600">
                กำลังเชื่อมต่อคลาวด์...
            </div>
        </div>

        <div class="mb-4 flex gap-2">
            <input type="file" id="excelFile" accept=".xlsx, .xls" class="hidden" onchange="importExcel(event)">
            <button onclick="document.getElementById('excelFile').click()" class="bg-green-500 text-white px-4 py-2 rounded">นำเข้า Excel</button>
            <button onclick="exportExcel()" class="bg-blue-500 text-white px-4 py-2 rounded">ส่งออก Excel</button>
            <button onclick="clearAllData()" class="bg-red-500 text-white px-4 py-2 rounded ml-auto">ล้างข้อมูล</button>
        </div>

        <table class="w-full text-left border-collapse border border-gray-300">
            <thead>
                <tr class="bg-gray-200">
                    <th class="p-2 border">ลำดับ</th>
                    <th class="p-2 border">รหัสนักเรียน</th>
                    <th class="p-2 border">ชื่อ-นามสกุล</th>
                    <th class="p-2 border">สถานะ</th>
                </tr>
            </thead>
            <tbody id="studentTable">
                <tr>
                    <td colspan="4" class="p-4 text-center">กำลังโหลดข้อมูล...</td>
                </tr>
            </tbody>
        </table>

        <div class="mt-4 text-sm text-gray-600 flex gap-4">
            <span>รวมทั้งหมด: <span id="totalCount">0</span> คน</span>
            <span>มา: <span id="countPresent">0</span></span>
            <span>สาย: <span id="countLate">0</span></span>
            <span>ขาด: <span id="countAbsent">0</span></span>
            <span>ลา: <span id="countLeave">0</span></span>
        </div>
    </div>

    <!-- Firebase Real-time Sync -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAp_4sj7XEQ-zK9lvFobtJIWnSaxXW4yWk",
            authDomain: "steam-ba72b.firebaseapp.com",
            projectId: "steam-ba72b",
            storageBucket: "steam-ba72b.firebasestorage.app",
            messagingSenderId: "803240609180",
            appId: "1:803240609180:web:7b08c17c1b452b1c61b459",
            measurementId: "G-P3LZZ6JB2Y"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const docRef = doc(db, "attendance", "current_list");

        let studentsData = [];

        // ซิงค์ข้อมูลเรียลไทม์
        onSnapshot(docRef, (docSnap) => {
            const statusDiv = document.getElementById('status');
            if (docSnap.exists()) {
                studentsData = docSnap.data().students || [];
                renderTable();
                statusDiv.className = "text-sm font-semibold text-green-600";
                statusDiv.innerText = "เชื่อมต่อเรียลไทม์แล้ว";
            } else {
                studentsData = [];
                renderTable();
                statusDiv.className = "text-sm font-semibold text-blue-600";
                statusDiv.innerText = "พร้อมใช้งาน (ยังไม่มีข้อมูล)";
            }
        });

        async function saveDataToCloud(newData) {
            try {
                await setDoc(docRef, { students: newData });
            } catch (e) {
                alert("เกิดข้อผิดพลาดในการบันทึก: " + e.message);
            }
        }

        window.renderTable = function() {
            const tbody = document.getElementById('studentTable');
            tbody.innerHTML = '';

            if (studentsData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-gray-500">ไม่มีข้อมูลนักเรียน</td></tr>`;
                updateSummary();
                return;
            }

            studentsData.forEach((student, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-2 border text-center">${index + 1}</td>
                    <td class="p-2 border">${student.id || '-'}</td>
                    <td class="p-2 border">${student.name || '-'}</td>
                    <td class="p-2 border">
                        <select onchange="updateStatus(${index}, this.value)" class="p-1 border rounded w-full">
                            <option value="มา" ${student.status === 'มา' ? 'selected' : ''}>มา</option>
                            <option value="สาย" ${student.status === 'สาย' ? 'selected' : ''}>สาย</option>
                            <option value="ขาด" ${student.status === 'ขาด' ? 'selected' : ''}>ขาด</option>
                            <option value="ลา" ${student.status === 'ลา' ? 'selected' : ''}>ลา</option>
                        </select>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            updateSummary();
        };

        function updateSummary() {
            document.getElementById('totalCount').innerText = studentsData.length;
            document.getElementById('countPresent').innerText = studentsData.filter(s => s.status === 'มา').length;
            document.getElementById('countLate').innerText = studentsData.filter(s => s.status === 'สาย').length;
            document.getElementById('countAbsent').innerText = studentsData.filter(s => s.status === 'ขาด').length;
            document.getElementById('countLeave').innerText = studentsData.filter(s => s.status === 'ลา').length;
        }

        window.updateStatus = function(index, newStatus) {
            studentsData[index].status = newStatus;
            saveDataToCloud(studentsData);
        };

        window.importExcel = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(worksheet);

                const formattedData = jsonData.map(row => ({
                    id: row['รหัสนักเรียน'] || row['ID'] || row['id'] || '',
                    name: row['ชื่อ-นามสกุล'] || row['ชื่อ'] || row['Name'] || '',
                    status: row['สถานะ'] || 'มา'
                }));
                saveDataToCloud(formattedData);
            };
            reader.readAsArrayBuffer(file);
        };

        window.exportExcel = function() {
            if (studentsData.length === 0) return alert('ไม่มีข้อมูล');
            const exportData = studentsData.map((s, idx) => ({
                'ลำดับ': idx + 1, 'รหัสนักเรียน': s.id, 'ชื่อ-นามสกุล': s.name, 'สถานะ': s.status
            }));
            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "เช็คชื่อ");
            XLSX.writeFile(wb, "รายงานเช็คชื่อ.xlsx");
        };

        window.clearAllData = function() {
            if (confirm('คุณต้องการลบข้อมูลทั้งหมดใช่หรือไม่?')) saveDataToCloud([]);
        };
    </script>
</body>
</html>
